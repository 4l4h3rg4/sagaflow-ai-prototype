<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SagaFlow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@400;500;60_0&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .font-cinzel {
        font-family: 'Cinzel', serif;
      }

      /* Theme Variables */
      body.theme-dark {
        /* "Midnight" Palette */
        --color-bg: #111827; /* gray-900 */
        --color-text-primary: #f9fafb; /* gray-50 */
        --color-text-secondary: #e5e7eb; /* gray-200 */
        --color-text-muted: #9ca3af; /* gray-400 */
        --color-card-bg: rgba(31, 41, 55, 0.6); /* gray-800/60 */
        --color-input-bg: rgba(17, 24, 39, 0.8); /* gray-900/80 */
        --color-border: #374151; /* gray-700 */
        --color-accent: #a78bfa; /* violet-400 */
        --color-accent-hover: #8b5cf6; /* violet-500 */
        --color-accent-strong: #7c3aed; /* violet-600 */
        --color-header-gradient-from: #8b5cf6; /* violet-500 */
        --color-header-gradient-via: #ec4899; /* pink-500 */
        --color-header-gradient-to: #f59e0b; /* amber-500 */
        --color-button-gradient-from: #7c3aed; /* violet-600 */
        --color-button-gradient-to: #c026d3; /* fuchsia-600 */
        --color-button-gradient-from-hover: #6d28d9; /* violet-700 */
        --color-button-gradient-to-hover: #a21caf; /* fuchsia-700 */
        --color-destructive: #f87171; /* red-400 */
        --color-destructive-hover: #ef4444; /* red-500 */
        --color-destructive-bg: rgba(76, 29, 29, 0.5); /* red-900/50 */
      }

      body.theme-light {
        /* "Lilac Dream" Palette - Soft, comfy, and legible */
        --color-bg: #f8f7fc; /* very pale lavender */
        --color-text-primary: #3c335b; /* deep, muted indigo */
        --color-text-secondary: #5e577d; /* muted purple-grey */
        --color-text-muted: #918ca9; /* light purple-grey */
        --color-card-bg: #ffffff; /* white */
        --color-input-bg: #ffffff; /* white */
        --color-border: #e0ddea; /* soft lavender-grey */
        --color-accent: #8e7cc3; /* main lilac */
        --color-accent-hover: #7b68b0; /* darker lilac */
        --color-accent-strong: #69569e; /* darkest lilac for focus */
        --color-header-gradient-from: #a084e8; /* soft lilac */
        --color-header-gradient-via: #c797eb; /* soft orchid */
        --color-header-gradient-to: #eab5f2; /* soft mauve */
        --color-button-gradient-from: #8e7cc3; /* main lilac */
        --color-button-gradient-to: #7b68b0; /* darker lilac */
        --color-button-gradient-from-hover: #7b68b0; /* darker lilac */
        --color-button-gradient-to-hover: #69569e; /* darkest lilac */
        --color-destructive: #ef798a; /* soft rose */
        --color-destructive-hover: #e86376; /* darker soft rose */
        --color-destructive-bg: #fae8eb; /* very light rose */
      }
      
      body.theme-mystic {
        /* "Starlight" Palette */
        --color-bg-image: linear-gradient(to bottom right, #0c0a09, #1e1b4b, #0c0a09);
        --color-bg: #0c0a09;
        --color-text-primary: #e0e7ff; /* indigo-100 */
        --color-text-secondary: #c7d2fe; /* indigo-200 */
        --color-text-muted: #a5b4fc; /* indigo-300 */
        --color-card-bg: rgba(2, 6, 23, 0.4); /* slate-950/40 */
        --color-input-bg: rgba(2, 6, 23, 0.6); /* slate-950/60 */
        --color-border: rgba(99, 102, 241, 0.3); /* indigo-400/30 */
        --color-accent: #a5b4fc; /* indigo-300 */
        --color-accent-hover: #818cf8; /* indigo-400 */
        --color-accent-strong: #6366f1; /* indigo-500 */
        --color-header-gradient-from: #6366f1; /* indigo-500 */
        --color-header-gradient-via: #a855f7; /* purple-500 */
        --color-header-gradient-to: #38bdf8; /* sky-400 */
        --color-button-gradient-from: #4f46e5; /* indigo-600 */
        --color-button-gradient-to: #0e7490; /* cyan-700 */
        --color-button-gradient-from-hover: #4338ca; /* indigo-700 */
        --color-button-gradient-to-hover: #155e75; /* cyan-800 */
        --color-destructive: #fca5a5; /* red-300 */
        --color-destructive-hover: #f87171; /* red-400 */
        --color-destructive-bg: rgba(153, 27, 27, 0.3); /* red-900/30 */
      }
      
      body.theme-mystic {
        background-image: var(--color-bg-image);
      }

      .gradient-button {
          background-image: linear-gradient(to right, var(--color-button-gradient-from), var(--color-button-gradient-to));
      }
      .gradient-button:hover:not(:disabled) {
          background-image: linear-gradient(to right, var(--color-button-gradient-from-hover), var(--color-button-gradient-to-hover));
      }
    </style>

</head>

</html>
